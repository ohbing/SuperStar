name: 刷课-账号2

on:
  push:
    branches: [ main ]
  #schedule:
  #  - cron: "0 0 * * *"

jobs:
  Start:
    runs-on: ubuntu-latest
    steps:
      - name: 拷贝代码
        uses: actions/checkout@v4

      - name: 设置python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖包
        run: |
          pip install -r ./requirements.txt

      - name: Run main.py
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY_2 }}
        run: python main.py -u ${{ secrets.USER_PHONE_2 }} -p ${{ secrets.USER_PWD_2 }} -l 154411218
